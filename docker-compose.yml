version: '3.8'

services:
  backend:
    build: ./backend
    expose:
      - "5001"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-tu-clave-secreta-por-defecto}
    volumes:
      - ./telegram_messages.json:/app/telegram_messages.json
    networks:
      - monitoria
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.runtime
    container_name: monitoria-frontend
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=/api
    depends_on:
      - backend
    networks:
      - monitoria
    restart: unless-stopped

networks:
  monitoria:
    driver: bridge
