services:
  backend:
    build: ./backend
    expose:
      - "5001"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-tu-clave-secreta-por-defecto}
    networks:
      - monitoria
    restart: unless-stopped

  topic_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: ["python", "topic_worker.py"]
    environment:
      - TOPIC_POLL_INTERVAL_MIN=${TOPIC_POLL_INTERVAL_MIN:-1440}
      - TOPICS_NUM_TOPICS=${TOPICS_NUM_TOPICS:-50}
      - TOPICS_SAMPLE_RATIO=${TOPICS_SAMPLE_RATIO:-0.3}
    networks:
      - monitoria
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.runtime
    container_name: monitoria-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - REACT_APP_API_URL=/api
    depends_on:
      - backend
    networks:
      - monitoria
    restart: unless-stopped

networks:
  monitoria:
    driver: bridge
