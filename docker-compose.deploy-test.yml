# Overlay: frontend se construye completo en Docker (no requiere carpeta frontend/build en el host).
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.deploy-test.yml up --build -d
# Puerto por defecto 8080 para no chocar con otros servicios en 80.

version: '3.8'

services:
  backend:
    env_file:
      - .env
    environment:
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - S3_BUCKET=${S3_BUCKET:-monitoria-data}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-tu-clave-secreta-por-defecto}
      # DATABASE_URL solo vía env_file (.env); no usar ${DATABASE_URL:-} aquí porque
      # sobrescribe con cadena vacía si el shell no exportó la variable al hacer compose up.

  frontend:
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.deploy}
      args:
        REACT_APP_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-8080}:80"
