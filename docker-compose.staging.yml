# Staging en paralelo a producción (mismo host, otro puerto y otro proyecto Compose).
# Uso: ./scripts/deploy-staging.sh

services:
  backend:
    container_name: monitoria-staging-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    environment:
      - TOPICS_META_KEY=${TOPICS_META_KEY:-topics/staging/topics.json}
      - TOPICS_ASSIGNMENTS_KEY=${TOPICS_ASSIGNMENTS_KEY:-topics/staging/message_topics.csv}
      - TOPICS_TITLES_KEY=${TOPICS_TITLES_KEY:-topics/staging/topic_titles.json}
      # No usar AUTH_FRONTEND_URL de producción (app.monitoria.org): el magic link
      # debe abrir el frontend de staging. Sobrescribe el valor del .env compartido.
      - AUTH_FRONTEND_URL=${STAGING_PUBLIC_URL:-http://localhost:8080}
      # En staging devolvemos el enlace en el JSON de login-request (además del email).
      - AUTH_DEV_RETURN_LINK=${STAGING_AUTH_DEV_RETURN_LINK:-1}
    volumes:
      - staging-backend-cache:/app/data/cache
      - staging-backend-instance:/app/instance
      # Allowlist del host (no va en Git). Sin este mount, el contenedor no ve
      # backend/allowed_emails.txt salvo que se haya copiado en el build.
      - ./backend/allowed_emails.txt:/app/allowed_emails.txt:ro

  frontend:
    container_name: monitoria-staging-frontend
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.deploy}
      args:
        REACT_APP_API_URL: /api
        REACT_APP_APP_VERSION: "1.0"
        REACT_APP_ACCESS_REQUEST_URL: ${REACT_APP_ACCESS_REQUEST_URL:-}
    ports:
      - "${STAGING_FRONTEND_PORT:-8080}:80"

  topic_worker:
    profiles:
      - with-worker

volumes:
  staging-backend-cache:
  staging-backend-instance:
