# Staging en paralelo a producción (mismo host, otro puerto y otro proyecto Compose).
# Uso: ./scripts/deploy-staging.sh

services:
  backend:
    container_name: monitoria-staging-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    environment:
      - TOPICS_META_KEY=${TOPICS_META_KEY:-topics/staging/topics.json}
      - TOPICS_ASSIGNMENTS_KEY=${TOPICS_ASSIGNMENTS_KEY:-topics/staging/message_topics.csv}
      - TOPICS_TITLES_KEY=${TOPICS_TITLES_KEY:-topics/staging/topic_titles.json}
    volumes:
      - staging-backend-cache:/app/data/cache
      - staging-backend-instance:/app/instance

  frontend:
    container_name: monitoria-staging-frontend
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.deploy}
      args:
        REACT_APP_API_URL: /api
        REACT_APP_APP_VERSION: "1.0"
    ports:
      - "${STAGING_FRONTEND_PORT:-8080}:80"

  topic_worker:
    profiles:
      - with-worker

volumes:
  staging-backend-cache:
  staging-backend-instance:
